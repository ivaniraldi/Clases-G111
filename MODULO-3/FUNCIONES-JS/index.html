<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <title>Funciones - JavaScript</title>
  </head>
  <body>
    <h1 id="titulo">Hola mundo</h1>
    <button onclick="pintar('red', 'Mensaje: rojo')">Pintar rojo</button>
    <button onclick="pintar('green')">Pintar verde</button>
    <button onclick="pintar('blue')">Pintar azul</button>
    <button onclick="pintar('yellow')">Pintar amarillo</button>
    <button onclick="pintar()">Pintar</button>
    <div id="box"></div>

    <input id="valor" type="number">
    <button onclick="getValue(document.querySelector('#valor').value)">Enviar</button>

    <p id="p1" style="background-color: blue;">Parrafo 1</p>
    <p id='p2' class="p2" style="background-color: red;">Parrafo 2</p>

    <img
      id="img"
      class="img"
      style="width: 100px"
      onclick="agregarBorde('.img')"
      src="https://plus.unsplash.com/premium_photo-1699037043878-792cdd8c3684?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"
      alt=""
    />
    <img
      id="img2"
      class="img2"
      style="width: 100px"
      onclick="agregarBorde('.img2', 'red')"
      src="https://plus.unsplash.com/premium_photo-1699037043878-792cdd8c3684?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"
      alt=""
    />
    <img
      id="img3"
      class="img3"
      style="width: 100px"
      onclick="agregarBorde('.img3', 'orange')"
      src="https://plus.unsplash.com/premium_photo-1699037043878-792cdd8c3684?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"
      alt=""
    />
    <script src="./assets/js/index.js"></script>
  </body>
</html>
