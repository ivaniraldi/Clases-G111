<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="key" style="width: 200px; height: 200px; border: 1px solid black;"></div>

    <script>
        let color = "white"
        const elementoDiv = document.querySelector("#key")

        document.addEventListener("keydown", (e)=>{
            if(e.key == "a"){
                let color = "pink"
                elementoDiv.style.backgroundColor = color
                
            }else if(e.key == "s"){
                let color = "orange"
                elementoDiv.style.backgroundColor = color

            }else if(e.key == "d"){
                let color = "lightblue"
                elementoDiv.style.backgroundColor = color
            }
            else if(e.key == "q"){
                let body = document.querySelector("body")
                body.innerHTML += "<div style='width: 200px; height: 200px; border: 1px solid black; background-color: purple'></div>"
            }
            else if(e.key == "w"){
                let body = document.querySelector("body")
                body.innerHTML = body.innerHTML + "<div style='width: 200px; height: 200px; border: 1px solid black; background-color: gray'></div>"
            }
             else if(e.key == "e"){
                let body = document.querySelector("body")
                body.innerHTML += "<div style='width: 200px; height: 200px; border: 1px solid black; background-color: brown'></div>"
            }
        })



    </script>
</body>
</html>
